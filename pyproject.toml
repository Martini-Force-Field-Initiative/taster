[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taster"
version = "0.1.0"
description = "Martini CG free energy partition coefficient calculations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Luís Borges Araújo", email = "you@example.com" }]

dependencies = [
  "numpy>=1.20",
  "pandas>=1.0",
  "MDAnalysis>=2.0",
  "alchemlyb>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["taster*"]

[tool.setuptools.package-data]
taster = ["data/**/*"]

[project.scripts]
taster = "taster.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers   = [
    "gmx:  mark test as requiring a working GROMACS installation",
    "slow: mark test as long-running (excluded from the default run)",
]