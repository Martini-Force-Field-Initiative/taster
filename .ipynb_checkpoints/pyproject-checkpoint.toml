[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taster"
version = "0.1.0"
description = "Martini CG free energy partition coefficient calculations."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Luís Borges Araújo", email = "you@example.com" }]

dependencies = [
  "numpy",
  "pandas",
  "MDAnalysis",
  "alchemlyb",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["taster*"]

[tool.setuptools.package-data]
taster = ["data/**/*"]

[project.scripts]
taster = "taster.cli:main"